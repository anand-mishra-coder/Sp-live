<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Course Details · LiveClass Pro</title><link rel="stylesheet" href="css/global.css"></head><body data-page="app">
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html">LiveClass <span>Pro</span></a><nav class="nav"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="live-class.html">Live</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="notes.html">Notes</a></nav><div class="user"><div class="avatar">S</div><div><b class="user-name">Student</b><div class="user-role muted">student</div></div><button class="btn small logout">Logout</button></div></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow">Workspace</div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="live-class.html">Live Class</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="recordings.html">Recordings</a><a class="nav-link" href="notes.html">Notes</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a><a class="nav-link" href="help.html">Help</a><a class="nav-link staff-only" href="teacher.html">Teacher</a><a class="nav-link admin-only" href="admin.html">Admin</a><a class="nav-link staff-only" href="admin-live.html">Live Control</a></nav></aside><main class="main"><div id="course"></div><div id="chapters" class="grid" style="margin-top:18px"></div>
<script type="module">import {requireAuth} from "./js/auth.js";import {db,doc,getDoc,collection,query,where,onSnapshot,updateDoc} from "./js/firebase.js";import {toast} from "./js/app.js";const {user}=await requireAuth();const id=new URLSearchParams(location.search).get("id");if(!id){location.href="courses.html"}const c=await getDoc(doc(db,"courses",id));const x=c.data()||{};document.querySelector("#course").innerHTML=`<div class="card"><div class="eyebrow">${x.subject||"Course"}</div><h1>${x.title||"Course"}</h1><p class="muted">${x.description||""}</p><div class="actions"><button id="continue" class="btn primary">Continue learning</button><a href="schedule.html" class="btn">View schedule</a></div></div>`;onSnapshot(query(collection(db,"lectures"),where("courseId","==",id)),s=>document.querySelector("#chapters").innerHTML=s.docs.map(d=>{let v=d.data();return `<div class="card"><div class="title-row"><div><b>${v.title||"Lecture"}</b><div class="muted">${v.chapter||""}</div></div><button class="btn small done" data-id="${d.id}">${v.completedBy?.includes?.(user.uid)?"Completed":"Mark complete"}</button></div>${v.videoUrl?`<video class="video" controls src="${v.videoUrl}"></video>`:""}<p class="muted">${v.description||""}</p></div>`}).join("")||'<div class="empty">No lectures yet.</div>');document.addEventListener("click",async e=>{if(e.target.matches(".done")){let d=await getDoc(doc(db,"lectures",e.target.dataset.id));let v=d.data();let a=Array.isArray(v.completedBy)?v.completedBy:[];if(!a.includes(user.uid))a.push(user.uid);await updateDoc(d.ref,{completedBy:a});toast("Lecture marked complete","success")}});document.querySelector("#continue").onclick=()=>{const first=document.querySelector(".done");if(first) first.scrollIntoView({behavior:"smooth"})};</script></body></html></main></div><nav class="mobile-nav"><a href="dashboard.html">Home</a><a href="courses.html">Courses</a><a href="live-class.html">Live</a><a href="tests.html">Tests</a><a href="profile.html">Profile</a></nav><script type="module" src="js/app.js"></script></body></html>
