<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Courses · LiveClass Pro</title><link rel="stylesheet" href="css/global.css"></head><body data-page="app">
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html">LiveClass <span>Pro</span></a><nav class="nav"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="live-class.html">Live</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="notes.html">Notes</a></nav><div class="user"><div class="avatar">S</div><div><b class="user-name">Student</b><div class="user-role muted">student</div></div><button class="btn small logout">Logout</button></div></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow">Workspace</div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="live-class.html">Live Class</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="recordings.html">Recordings</a><a class="nav-link" href="notes.html">Notes</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a><a class="nav-link" href="help.html">Help</a><a class="nav-link staff-only" href="teacher.html">Teacher</a><a class="nav-link admin-only" href="admin.html">Admin</a><a class="nav-link staff-only" href="admin-live.html">Live Control</a></nav></aside><main class="main"><div class="title-row"><div><div class="eyebrow">Learning library</div><h1>Courses</h1></div><input id="search" class="field search" placeholder="Search courses"></div><div id="courses" class="grid g3"></div>
<script type="module">import {requireAuth} from "./js/auth.js";import {db,collection,onSnapshot} from "./js/firebase.js";await requireAuth();const $=x=>document.querySelector(x);let data=[];onSnapshot(collection(db,"courses"),s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()});$("#search").oninput=render;function render(){let q=$("#search").value.toLowerCase();$("#courses").innerHTML=data.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.subject||"").toLowerCase().includes(q)).map(x=>`<article class="card"><span class="badge">${x.subject||"General"}</span><h2>${x.title||"Course"}</h2><p class="muted">${x.description||"Structured learning program."}</p><div class="progress"><i style="width:${x.progress||0}%"></i></div><div class="actions" style="margin-top:14px"><a class="btn primary" href="course-details.html?id=${x.id}">Open course</a><span class="pill">${x.progress||0}% complete</span></div></article>`).join("")||'<div class="empty">No courses found.</div>'}</script></body></html></main></div><nav class="mobile-nav"><a href="dashboard.html">Home</a><a href="courses.html">Courses</a><a href="live-class.html">Live</a><a href="tests.html">Tests</a><a href="profile.html">Profile</a></nav><script type="module" src="js/app.js"></script></body></html>
