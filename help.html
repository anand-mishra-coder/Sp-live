<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Help · LiveClass Pro</title><link rel="stylesheet" href="css/global.css"></head><body data-page="app">
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html">LiveClass <span>Pro</span></a><nav class="nav"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="live-class.html">Live</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="notes.html">Notes</a></nav><div class="user"><div class="avatar">S</div><div><b class="user-name">Student</b><div class="user-role muted">student</div></div><button class="btn small logout">Logout</button></div></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow">Workspace</div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="live-class.html">Live Class</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="recordings.html">Recordings</a><a class="nav-link" href="notes.html">Notes</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a><a class="nav-link" href="help.html">Help</a><a class="nav-link staff-only" href="teacher.html">Teacher</a><a class="nav-link admin-only" href="admin.html">Admin</a><a class="nav-link staff-only" href="admin-live.html">Live Control</a></nav></aside><main class="main"><div class="title-row"><div><div class="eyebrow">Support center</div><h1>Help & Support</h1></div><input id="q" class="field search" placeholder="Search help"></div><div id="faq" class="grid g2"></div><div class="card" style="margin-top:18px"><h2>Report a problem</h2><div class="field"><label>Issue</label><textarea id="issue"></textarea></div><button id="report" class="btn primary">Submit report</button></div><script type="module">import {requireAuth} from "./js/auth.js";import {db,collection,addDoc,serverTimestamp} from "./js/firebase.js";import {toast} from "./js/app.js";const {user}=await requireAuth();let a=[["Camera","Allow camera permission in browser settings. On Android, use HTTPS/localhost and switch cameras with the camera control."],["Microphone","Allow microphone permission and choose the correct input device."],["WebRTC","Use Chrome/Edge/Safari with a stable connection. Refreshing the live room creates a new peer session."],["Connection","Disable VPN/data saver and use a stable Wi-Fi/5G connection."],["Tests","A submitted test creates an immutable result record tied to your account."]];function r(){let q=document.querySelector("#q").value.toLowerCase();document.querySelector("#faq").innerHTML=a.filter(x=>x.join(" ").toLowerCase().includes(q)).map(x=>`<details class="card"><summary><b>${x[0]}</b></summary><p class="muted">${x[1]}</p></details>`).join("")}document.querySelector("#q").oninput=r;r();document.querySelector("#report").onclick=async()=>{let issue=document.querySelector("#issue").value.trim();if(!issue)return;await addDoc(collection(db,"reports"),{userId:user.uid,issue,status:"open",createdAt:serverTimestamp()});document.querySelector("#issue").value="";toast("Report submitted","success")}</script></body></html></main></div><nav class="mobile-nav"><a href="dashboard.html">Home</a><a href="courses.html">Courses</a><a href="live-class.html">Live</a><a href="tests.html">Tests</a><a href="profile.html">Profile</a></nav><script type="module" src="js/app.js"></script></body></html>
