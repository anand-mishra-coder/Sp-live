<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Login · LiveClass Pro</title><link rel="stylesheet" href="css/global.css"></head><body data-page="public">
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html">LiveClass <span>Pro</span></a><nav class="nav"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="live-class.html">Live</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="notes.html">Notes</a></nav><div class="user"><div class="avatar">S</div><div><b class="user-name">Student</b><div class="user-role muted">student</div></div><button class="btn small logout">Logout</button></div></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow">Workspace</div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="live-class.html">Live Class</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="recordings.html">Recordings</a><a class="nav-link" href="notes.html">Notes</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a><a class="nav-link" href="help.html">Help</a><a class="nav-link staff-only" href="teacher.html">Teacher</a><a class="nav-link admin-only" href="admin.html">Admin</a><a class="nav-link staff-only" href="admin-live.html">Live Control</a></nav></aside><main class="main"><div style="max-width:520px;margin:50px auto"><div class="card"><div class="eyebrow">Secure access</div><h1>Welcome back</h1><p class="muted">Sign in to continue to your classroom.</p><div class="field"><label>Name (only for new accounts)</label><input id="name" autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button id="login" class="btn primary">Login</button><button id="signup" class="btn">Create account</button><button id="google" class="btn">Continue with Google</button></div><p id="status" class="muted"></p></div></div>
<script type="module">import {Auth} from "./js/auth.js";import {toast} from "./js/app.js";import {auth} from "./js/firebase.js";import {onAuthStateChanged} from "./js/firebase.js";
const $=x=>document.querySelector(x); const run=async(fn)=>{try{$("#status").textContent="Working…";await fn();location.href="dashboard.html"}catch(e){$("#status").textContent=e.message;toast(e.message,"error")}};
onAuthStateChanged(auth,u=>{if(u) location.href="dashboard.html"});
$("#login").onclick=()=>run(()=>Auth.login($("#email").value.trim(),$("#password").value));
$("#signup").onclick=()=>run(()=>Auth.email($("#email").value.trim(),$("#password").value,$("#name").value.trim()));
$("#google").onclick=()=>run(()=>Auth.google());</script></body></html></main></div><nav class="mobile-nav"><a href="dashboard.html">Home</a><a href="courses.html">Courses</a><a href="live-class.html">Live</a><a href="tests.html">Tests</a><a href="profile.html">Profile</a></nav><script type="module" src="js/app.js"></script></body></html>
