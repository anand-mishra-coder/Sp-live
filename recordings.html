<div class="layout"><aside class="sidebar"><div class="eyebrow">Workspace</div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="live-class.html">Live Class</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="recordings.html">Recordings</a><a class="nav-link" href="notes.html">Notes</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a><a class="nav-link" href="help.html">Help</a><a class="nav-link staff-only" href="teacher.html">Teacher</a><a class="nav-link admin-only" href="admin.html">Admin</a><a class="nav-link staff-only" href="admin-live.html">Live Control</a></nav></aside><main class="main"><div class="title-row"><h1>Recorded Classes</h1><input id="q" class="field search" placeholder="Search recordings"></div><div id="list" class="grid g3"></div><script type="module">import {requireAuth} from "./js/auth.js";import {db,collection,onSnapshot} from "./js/firebase.js";await requireAuth();let a=[];const r=()=>{let q=document.querySelector("#q").value.toLowerCase();document.querySelector("#list").innerHTML=a.filter(x=>(x.title||"").toLowerCase().includes(q)).map(x=>`<article class="card"><span class="badge">${x.subject||""}</span><h2>${x.title||"Recording"}</h2><p class="muted">${x.teacher||""}</p>${x.url?`<video class="video" controls src="${x.url}"></video>`:""}<a class="btn" href="${x.url||"#"}" target="_blank" style="display:inline-block;margin-top:10px">Open recording</a></article>`).join("")||'<div class="empty">No recordings.</div>'};onSnapshot(collection(db,"recordings"),s=>{a=s.docs.map(d=>d.data());r()});document.querySelector("#q").oninput=r</script></body></html></main></div><nav class="mobile-nav"><a href="dashboard.ht
