<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Schedule · LiveClass Pro</title><link rel="stylesheet" href="css/global.css"></head><body data-page="app">
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html">LiveClass <span>Pro</span></a><nav class="nav"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="live-class.html">Live</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="notes.html">Notes</a></nav><div class="user"><div class="avatar">S</div><div><b class="user-name">Student</b><div class="user-role muted">student</div></div><button class="btn small logout">Logout</button></div></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow">Workspace</div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="live-class.html">Live Class</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="recordings.html">Recordings</a><a class="nav-link" href="notes.html">Notes</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a><a class="nav-link" href="help.html">Help</a><a class="nav-link staff-only" href="teacher.html">Teacher</a><a class="nav-link admin-only" href="admin.html">Admin</a><a class="nav-link staff-only" href="admin-live.html">Live Control</a></nav></aside><main class="main"><div class="title-row"><div><div class="eyebrow">Plan your week</div><h1>Class Schedule</h1></div><a class="btn primary" href="live-class.html">Live classroom</a></div><div id="schedule" class="grid"></div>
<script type="module">import {requireAuth} from "./js/auth.js";import {db,collection,onSnapshot,query,orderBy} from "./js/firebase.js";await requireAuth();onSnapshot(query(collection(db,"schedules"),orderBy("createdAt","desc")),s=>document.querySelector("#schedule").innerHTML=s.docs.map(d=>{let x=d.data();return `<div class="card"><div class="title-row"><div><span class="badge">${x.subject||"Class"}</span><h2>${x.title||"Live class"}</h2><p class="muted">${x.teacher||""}</p></div><a class="btn primary" href="live-class.html?session=${x.sessionId||""}">Join</a></div><div class="grid g3"><span>Start <b>${x.startTime||"TBA"}</b></span><span>Duration <b>${x.duration||"60"} min</b></span><span>Room <b>${x.room||"Online"}</b></span></div></div>`}).join("")||'<div class="empty">No scheduled classes.</div>');</script></body></html></main></div><nav class="mobile-nav"><a href="dashboard.html">Home</a><a href="courses.html">Courses</a><a href="live-class.html">Live</a><a href="tests.html">Tests</a><a href="profile.html">Profile</a></nav><script type="module" src="js/app.js"></script></body></html>
