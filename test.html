<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Test Attempt · LiveClass Pro</title><link rel="stylesheet" href="css/global.css"></head><body data-page="app">
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html">LiveClass <span>Pro</span></a><nav class="nav"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="live-class.html">Live</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="notes.html">Notes</a></nav><div class="user"><div class="avatar">S</div><div><b class="user-name">Student</b><div class="user-role muted">student</div></div><button class="btn small logout">Logout</button></div></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow">Workspace</div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="live-class.html">Live Class</a><a class="nav-link" href="courses.html">Courses</a><a class="nav-link" href="schedule.html">Schedule</a><a class="nav-link" href="recordings.html">Recordings</a><a class="nav-link" href="notes.html">Notes</a><a class="nav-link" href="tests.html">Tests</a><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a><a class="nav-link" href="help.html">Help</a><a class="nav-link staff-only" href="teacher.html">Teacher</a><a class="nav-link admin-only" href="admin.html">Admin</a><a class="nav-link staff-only" href="admin-live.html">Live Control</a></nav></aside><main class="main"><div id="test"></div><script type="module">
import {requireAuth} from "./js/auth.js";import {db,doc,getDoc,collection,addDoc,serverTimestamp} from "./js/firebase.js";import {toast} from "./js/app.js";
const {user}=await requireAuth();const id=new URLSearchParams(location.search).get("id");const snap=await getDoc(doc(db,"tests",id));const t=snap.data();let left=(t.duration||10)*60,answers={};function render(){document.querySelector("#test").innerHTML=`<div class="title-row"><div><div class="eyebrow">${t.subject||"Test"}</div><h1>${t.title||"Test"}</h1></div><div class="pill" id="timer">${Math.ceil(left/60)}:${String(left%60).padStart(2,"0")}</div></div><form id="form">${(t.questions||[]).map((q,i)=>`<div class="card" style="margin:12px 0"><b>${i+1}. ${q.text}</b><div class="grid" style="margin-top:10px">${(q.options||[]).map((o,j)=>`<label class="btn"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join("")}</div></div>`).join("")}<button class="btn primary" type="submit">Submit test</button></form>`;document.querySelector("#form").onsubmit=submit}async function submit(e){e.preventDefault();for(let i=0;i<(t.questions||[]).length;i++){let x=document.querySelector(`input[name=q${i}]:checked`);answers[i]=x?Number(x.value):null}let correct=0;(t.questions||[]).forEach((q,i)=>{if(answers[i]===q.answer)correct++});let total=t.questions?.length||0;let score=total?Math.round(correct/total*100):0;let r=await addDoc(collection(db,"results"),{studentId:user.uid,testId:id,testTitle:t.title||"",correct,total,score,answers,createdAt:serverTimestamp()});toast("Test submitted","success");location.href="result.html?id="+r.id}render();let iv=setInterval(()=>{left--;if(left<=0){clearInterval(iv);document.querySelector("#form").requestSubmit()}let m=document.querySelector("#timer");if(m)m.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`},1000);
</script></body></html></main></div><nav class="mobile-nav"><a href="dashboard.html">Home</a><a href="courses.html">Courses</a><a href="live-class.html">Live</a><a href="tests.html">Tests</a><a href="profile.html">Profile</a></nav><script type="module" src="js/app.js"></script></body></html>
